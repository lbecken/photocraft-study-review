id = "ws.path-confinement"
title = "Disk paths are confined to the workspace root at open and save; non-regular files are refused without blocking"
crate = "kiln-workspace"
tier = "high"
tests = [
    # Acceptance (T-008 AC-1, AC-2, AC-4, AC-6, AC-7, AC-8), Rust API.
    "kiln_workspace::acceptance_t008::open_through_escaping_symlinks_is_refused",
    "kiln_workspace::acceptance_t008::save_through_escaping_symlinks_touches_nothing",
    "kiln_workspace::acceptance_t008::link_swapped_in_after_open_is_refused_at_save",
    "kiln_workspace::acceptance_t008::non_regular_files_are_refused_without_blocking",
    "kiln_workspace::acceptance_t008::save_onto_non_regular_files_leaves_them_alone",
    "kiln_workspace::acceptance_t008::outside_root_wins_over_not_found",
    # Guard (T-008 AC-5): in-root symlinks keep working.
    "kiln_workspace::guard_t008::symlinks_inside_root_still_work",
    # Acceptance (T-008 AC-3, AC-6) through kiln-cli.
    "kiln_cli::acceptance_t008_cli::reviewer_exploit_is_refused_end_to_end",
    "kiln_cli::acceptance_t008_cli::fifo_and_socket_do_not_hang_run",
    "kiln_cli::acceptance_t008_cli::fifo_does_not_hang_exec",
    "kiln_cli::acceptance_t036_cli::unreadable_root_is_refused_at_start",
    "kiln_workspace::acceptance_t036_workspace::unreadable_root_is_refused_by_new",
    "kiln_workspace::guard_t036_removal_workspace::root_removed_and_replaced_by_link_is_refused",
    "kiln_workspace::guard_t036_removal_workspace::root_removed_and_replaced_by_new_directory_is_refused",
    "kiln_cli::guard_t036_removal_cli::root_removed_and_replaced_by_link_is_refused_through_control",
    "kiln_cli::guard_t036_removal_cli::root_removed_and_replaced_by_new_directory_is_refused_through_control",
    "kiln_cli::guard_t036_removal_cli::root_made_unreadable_after_start_stays_protected_through_control",
    "kiln_workspace::guard_t036_workspace::retargeted_root_link_is_refused",
    "kiln_workspace::guard_t036_workspace::vanished_root_is_refused",
    "kiln_cli::guard_t036_cli::retargeted_root_link_is_refused_through_control",
    "kiln_cli::guard_t036_cli::vanished_root_is_refused_through_control",
    "kiln_cli::acceptance_t037_cli::reopen_of_a_path_now_outside_is_refused",
    "kiln_cli::acceptance_t037_cli::reopen_after_the_root_moved_is_refused",
    "kiln_cli::acceptance_t037_cli::reopen_whose_walk_fails_inside_is_io_error",
    "kiln_cli::acceptance_t037_removal_cli::reopen_after_the_root_was_removed_is_refused",
    "kiln_commands::acceptance_t037_commands::reopen_after_the_root_changed_is_refused",
    "kiln_cli::guard_t037_cli::reopen_does_not_need_the_file",
    "kiln_cli::guard_t037_cli::reopen_in_a_memory_session_is_unchanged",
]
