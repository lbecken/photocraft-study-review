# Platform-test registry of `cargo xtask no-skip` (METHODOLOGY §8.1, ADR-0009 Decision 4).
# Every test fn, module containing tests or file (inner `#![cfg]`) behind a platform cfg —
# `unix` / `not(windows)`, `windows` / `not(unix)`, `target_os = "linux"`, `target_os = "macos"` —
# is listed here, with the document sentence it tests and its counterpart on the platforms its
# cfg leaves out (or "none" and why, or "pending" with the task that writes it and a date).
# Unlisted, mismatched or unused entries, a missing sentence or counterpart and an expired
# pending entry fail `no-skip`. `xtask/` is a gate path: only a high-tier task changes this file.
#
# [[test]]
# file = "crates/kiln-x/tests/acceptance_t0nn.rs"   # relative to the repository root, `/`-separated
# item = "a_fifo_test"         # module path in the file, then the fn or mod name; "<file>" for #![cfg]
# platforms = "unix"           # unix | windows | linux | macos: the cfg the item is behind
# doc = "docs/protocol/paths.md"                     # the document whose sentence the item tests
# quote = "FIFOs, sockets and devices are refused"   # occurs in `doc` (whitespace runs compare equal)
# counterpart = "pending"      # "<file>::<item>" | "none" | "pending"
# reason = "…"                 # required for "none" and "pending"
# task = "T-075"               # "pending" only: the task that writes the counterpart
# expires = "2026-12-31"       # "pending" only (today = HEAD's commit date)
#
# No entry yet (D-235 u1): the tests that need one are marked and listed by T-079, after this
# rule has reached main.
