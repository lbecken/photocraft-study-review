[workspace]
resolver = "3"
members = [
    "crates/kiln-text",
    "crates/kiln-syntax",
    "crates/kiln-search",
    "crates/kiln-workspace",
    "crates/kiln-commands",
    "crates/kiln-control",
    "crates/kiln-ui",
    "crates/kiln-testkit",
    "apps/kiln-cli",
    "apps/kiln",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# Dependencies are high-tier changes (CHARTER §4): add them here, through review.
[workspace.dependencies]
kiln-text = { path = "crates/kiln-text" }
kiln-syntax = { path = "crates/kiln-syntax" }
kiln-search = { path = "crates/kiln-search" }
kiln-workspace = { path = "crates/kiln-workspace" }
kiln-commands = { path = "crates/kiln-commands" }
kiln-control = { path = "crates/kiln-control" }
kiln-ui = { path = "crates/kiln-ui" }
# T-001 (D-1): rope storage for kiln-text. `cr_lines` without `unicode_lines` makes ropey break
# lines on exactly LF, CRLF and lone CR, as the kiln-text API specifies.
ropey = { version = "=1.6.1", default-features = false, features = ["cr_lines", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.61", default-features = false }
anyhow = "1"
toml = "0.8"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# `clippy.toml` allows unwrap/expect/panic/dbg inside #[test] code only.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
