# The gate on macOS and Windows, the Linux gate for candidates (`ci/**`), nightly and dispatch, the
# T-065 window procedure under Xvfb on Linux, and a window probe on macOS and Windows (T-070, ADR-0009).
# Changing this file is a high-tier change (CHARTER §4: gate path).
#
# Which job counts for main's colour is not stated here: it is the record's (METHODOLOGY §8.1). A job is
# tracking until a decision row names its first green run on main.
#
# `paths-ignore` is built from `xtask/ledger.toml` as T-041 builds `ci.yml`'s: for each entry with
# `mode = "any"`, in file order, `e` and `e/**` (`e` = the path without a trailing `/`); `add-only`
# entries contribute nothing. `xtask/tests/acceptance_t070.rs` checks it against `xtask/ledger.toml`.
name: platforms

on:
  push:
    branches: [main, 'ci/**']
    paths-ignore:
      - 'tasks'
      - 'tasks/**'
      - 'metrics'
      - 'metrics/**'
      - 'docs/decisions.md'
      - 'docs/decisions.md/**'
      - 'docs/adr'
      - 'docs/adr/**'
      - 'STATE.md'
      - 'STATE.md/**'
      - 'handoffs'
      - 'handoffs/**'
      - 'retrospectives'
      - 'retrospectives/**'
      - 'evaluations'
      - 'evaluations/**'
      - 'methodology'
      - 'methodology/**'
      - 'incidents'
      - 'incidents/**'
  schedule:
    # Nightly at 03:17 UTC, on the default branch.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency:` group on purpose (as `ci.yml`): every state is checked to the end.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    # Git Bash on Windows.
    shell: bash

jobs:
  gate-macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          cargo --version
          cargo clippy --version
          rustfmt --version

      - name: Cache cargo registry and target
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Gate
        id: gate
        run: cargo xtask ci --keep-going --report gate-report.json

      - name: Gate report
        if: always()
        run: |
          set +e
          if [ -f gate-report.json ]; then cat gate-report.json; echo; else echo "GATE REPORT: none written"; fi
          exit 0

      - name: Core crates (reported, not required)
        if: always()
        # One `cargo test` per package: with several `-p` in one run, a package whose tests do not
        # compile stops every other package's tests (D-182 m1).
        run: |
          set +e
          : > core-crates.txt
          summary=""
          for p in kiln-text kiln-syntax kiln-search xtask; do
            echo "==== cargo test --locked --no-fail-fast -p $p" >> core-crates.txt
            cargo test --locked --no-fail-fast -p "$p" >> core-crates.txt 2>&1
            rc=$?
            echo "==== $p: exit status $rc" >> core-crates.txt
            summary="$summary $p=$rc"
          done
          grep -E '^(==== |test result:|     Running |   Doc-tests |error)' core-crates.txt
          echo "CORE CRATES: exit status per package:$summary (reported, not required)"
          exit 0

      - name: Test list
        if: always()
        # T-072 (ruling Q-3 A1, D-254): every test name per test binary, on every run. It reuses the
        # binaries the gate's `test` step built and runs no test; the verdicts are the gate's. The log
        # prints each binary's `Running` / `Doc-tests` line and every `error` line (colour codes
        # removed), then the exit status, which is recorded, not used.
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast -- --list > test-list.txt 2>&1
          rc=$?
          awk '{ gsub(/\033\[[0-9;]*[A-Za-z]/, "") } /^( +Running |   Doc-tests |error)/' test-list.txt
          echo "TEST LIST: exit status $rc"
          echo "TEST LIST: the status is recorded, not used; the gate step decides the colour"
          exit 0

      - name: Full test output (gate failed)
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast > test-output.txt 2>&1
          rc=$?
          # T-072: no line cap. Printed (colour codes removed): each failing test's `---- <name> stdout ----`
          # block with the 20 lines after it; a binary that aborted with its `Running` line and the abort
          # lines; every `error: could not compile`, `error[` and `error: test failed` line and the list
          # of failed targets; the `test result:` line of every binary. While a block is open (n > 0) every
          # line is the block's, a heading-shaped one included (it is printed there, so it is not printed
          # again before the next block); a `Running` / `Doc-tests` line starts a binary only outside a block.
          awk '
            { gsub(/\033\[[0-9;]*[A-Za-z]/, "") }
            /^---- .* stdout ----$/ { if (!shown) { print run; shown = 1 } print; n = 20; tl = 0; next }
            n > 0 {
              print; n--
              if ($0 ~ /^ +Running |^   Doc-tests /) { run = $0; shown = 1; tl = 0 }
              if ($0 ~ /^error: [0-9]+ targets? failed/) tl = 1
              next
            }
            /^ +Running |^   Doc-tests / { run = $0; shown = 0; tl = 0; next }
            /^test result:/ { print; next }
            /^error(\[|: could not compile|: test failed|: [0-9]+ targets? failed)/ { print; tl = ($0 ~ /targets? failed/); next }
            tl && /^    `/ { print; next }
            /has overflowed its stack|^fatal runtime error|^Caused by:|process didn.t exit successfully/ {
              if (!shown) { print run; shown = 1 } print; next
            }
          ' test-output.txt
          echo "TEST OUTPUT: exit status $rc"
          echo "TEST OUTPUT: the status is recorded, not used; the gate step decides the colour"
          exit 0

      - name: Disk
        if: always()
        run: |
          set +e
          echo "DISK: df -h of the workspace's volume"
          df -h .
          if [ -d target ]; then echo "DISK: du -sh target"; du -sh target; else echo "DISK: no target/"; fi
          exit 0

      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-macos-${{ github.run_id }}
          path: |
            gate-report.json
            core-crates.txt
            test-output.txt
            test-list.txt
          if-no-files-found: warn
          retention-days: 30

  gate-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
