          rc=$?
          awk '{ gsub(/\033\[[0-9;]*[A-Za-z]/, "") } /^( +Running |   Doc-tests |error)/' test-list.txt
          echo "TEST LIST: exit status $rc"
          echo "TEST LIST: the status is recorded, not used; the gate step decides the colour"
          exit 0

      - name: kiln-workspace test targets (reported, not required)
        if: always()
        # T-072 Interface (6) (ruling Q-5 A, D-254): every file crates/kiln-workspace/tests/<t>.rs, in
        # name order, as its own run, so a target added later is reported with no workflow edit and a
        # target that does not compile on Windows stops no other. Each run is appended to
        # windows-tests.txt with its exit status; the step's status is always 0, the gate step decides.
        run: |
          set +e
          export LC_ALL=C
          : > windows-tests.txt
          summary=""
          for f in crates/kiln-workspace/tests/*.rs; do
            [ -f "$f" ] || continue
            t="${f##*/}"; t="${t%.rs}"
            echo "==== cargo test --locked --no-fail-fast -p kiln-workspace --test $t -- --show-output" >> windows-tests.txt
            cargo test --locked --no-fail-fast -p kiln-workspace --test "$t" -- --show-output >> windows-tests.txt 2>&1
            rc=$?
            echo "==== $t: exit status $rc" >> windows-tests.txt
            summary="$summary $t=$rc"
          done
          awk '{ gsub(/\033\[[0-9;]*[A-Za-z]/, "") } /^(==== |test |test result:|---- |thread |error|MEASURED:)/' windows-tests.txt
          echo "WINDOWS TESTS: exit status per target:$summary (reported, not required)"
          exit 0

      - name: Full test output (gate failed)
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          set +e
          cargo test --workspace --locked --no-fail-fast > test-output.txt 2>&1
          rc=$?
          # T-072: no line cap. Printed (colour codes removed): each failing test's `---- <name> stdout ----`
          # block with the 20 lines after it; a binary that aborted with its `Running` line and the abort
          # lines; every `error: could not compile`, `error[` and `error: test failed` line and the list
          # of failed targets; the `test result:` line of every binary. While a block is open (n > 0) every
          # line is the block's, a heading-shaped one included (it is printed there, so it is not printed
          # again before the next block); a `Running` / `Doc-tests` line starts a binary only outside a block.
          awk '
            { gsub(/\033\[[0-9;]*[A-Za-z]/, "") }
            /^---- .* stdout ----$/ { if (!shown) { print run; shown = 1 } print; n = 20; tl = 0; next }
            n > 0 {
              print; n--
              if ($0 ~ /^ +Running |^   Doc-tests /) { run = $0; shown = 1; tl = 0 }
              if ($0 ~ /^error: [0-9]+ targets? failed/) tl = 1
              next
            }
            /^ +Running |^   Doc-tests / { run = $0; shown = 0; tl = 0; next }
            /^test result:/ { print; next }
            /^error(\[|: could not compile|: test failed|: [0-9]+ targets? failed)/ { print; tl = ($0 ~ /targets? failed/); next }
            tl && /^    `/ { print; next }
            /has overflowed its stack|^fatal runtime error|^Caused by:|process didn.t exit successfully/ {
              if (!shown) { print run; shown = 1 } print; next
            }
          ' test-output.txt
          echo "TEST OUTPUT: exit status $rc"
          echo "TEST OUTPUT: the status is recorded, not used; the gate step decides the colour"
          exit 0

      - name: Disk
        if: always()
        run: |
          set +e
          echo "DISK: df -h of the workspace's volume"
          df -h .
          if [ -d target ]; then echo "DISK: du -sh target"; du -sh target; else echo "DISK: no target/"; fi
          exit 0

      - name: Upload reports
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-windows-${{ github.run_id }}
          path: |
            gate-report.json
            core-crates.txt
            test-output.txt
            workspace-tests.txt
            test-list.txt
            windows-tests.txt
          if-no-files-found: warn
          retention-days: 30

  gate-linux:
    # Candidates (`ci/**`), nightly and dispatch only; on pushes to main `ci.yml` is the Linux gate.
    if: github.ref != 'refs/heads/main' || github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
