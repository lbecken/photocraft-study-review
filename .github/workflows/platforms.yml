      - name: Cache cargo registry and target
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Gate
        id: gate
        run: cargo xtask ci --keep-going --report gate-report.json

      - name: Gate report
        if: always()
        run: |
          set +e
