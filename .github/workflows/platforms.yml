            rc=$?
            echo "==== $p: exit status $rc" >> core-crates.txt
            summary="$summary $p=$rc"
          done
          grep -E '^(==== |test result:|     Running |   Doc-tests |error)' core-crates.txt
          echo "CORE CRATES: exit status per package:$summary (reported, not required)"
          exit 0

      - name: Workspace lib and T-073 tests (reported, not required)
        if: always()
        # T-073 (rulings Q-1 A, D-245, and y2, D-247): the gate's `test` step cannot build on Windows
        # until T-092; these test targets can. Each test's line (`test <name> ... ok`) and the passing
        # tests' output (`MEASURED:` lines) are kept in workspace-tests.txt; the step's status is
        # always 0, the gate step decides the colour.
        run: |
          set +e
          cargo test --locked --no-fail-fast -p kiln-workspace --lib --test acceptance_t073 --test guard_t073 -- --show-output > workspace-tests.txt 2>&1
          rc=$?
          grep -E '^(test |     Running |error|MEASURED:)' workspace-tests.txt
          echo "WORKSPACE TESTS: exit status $rc (reported, not required)"
          exit 0

      - name: Test list
        if: always()
        # T-072 (ruling Q-3 A1, D-254): every test name per test binary, on every run. It reuses the
        # binaries the gate's `test` step built and runs no test; the verdicts are the gate's. The log
        # prints each binary's `Running` / `Doc-tests` line and every `error` line (colour codes
        # removed), then the exit status, which is recorded, not used.
        run: |
          set +e
