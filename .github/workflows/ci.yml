# Re-checks every state of `main` with the same gate the local merge queue runs (D-003).
# Changing this file is a high-tier change (CHARTER §4).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No `concurrency:` group on purpose: a group would cancel or replace queued runs, and every
# state of main must be verified to the end.

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # no-skip reads HEAD's commit date; one commit of history is enough.
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          cargo --version
          cargo clippy --version
          rustfmt --version

      - name: Cache cargo registry and target
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Gate
        run: cargo xtask ci --report gate-report.json

      - name: Gate report
        if: always()
        run: cat gate-report.json || true
